<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="parentDiv">
        <div class="userInputDiv">
            <input type="text" placeholder="0" class="userInput" readonly>
        </div>
        <div class="calculatorDiv">
            <button id="clear" class="upSignButton">AC</button>
             <button id="plusMinus" class="upSignButton">±</button>
            <button id="percent" class="upSignButton">%</button>

            <button class="signs">÷</button>
           
            <button class="numberSeven">7</button>
             
            <button class="numberEight">8</button>
           
            <button class="numberNine">9</button>
            <button class="signs">*</button>
            
            <button class="numberFour">4</button>
             
            
             <button class="numberFive">5</button>

             
            
            <button class="numberSix">6</button>
            <button class="signs">-</button>
          
            
            <button class="numberOne">1</button>
            
             
            <button class="numberTwo">2</button>
            
            <button class="numberThree">3</button>
            <button class="signs">+</button>
            
            
            <button class="numberZero" id="numberZero">0</button>
            
            <button class="dot">.</button>
            <button class="equals" id="equals">=</button>
        </div>
        <script src="./calculator.js"></script>
    </div>

</body>

</html>
